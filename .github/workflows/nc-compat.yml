name: nc-compat

# Kompatibilitaets-Waechter: erkennt ein neues NC-Major und testet die App dagegen. Die Schritte liegen in nc-app-tooling.

on:
  schedule:
    - cron: '17 6 * * 1'   # Montag frueh (UTC)
  workflow_dispatch:
    inputs:
      simuliere_nc:
        description: 'Test: NC-Major erzwingen (z.B. 36). Leer = echt via Packagist.'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: nc-compat
  cancel-in-progress: false

jobs:
  compat:
    uses: cpcMomentum/nc-app-tooling/.github/workflows/nc-compat.yml@v1.21.0
    with:
      simuliere-nc: ${{ github.event.inputs.simuliere_nc }}
