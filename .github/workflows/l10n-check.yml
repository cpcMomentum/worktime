name: l10n consistency

# Waechter gegen Katalog-Drift (worktime#259). Stellt sicher, dass die
# Uebersetzungskataloge in l10n/ exakt zu den t()/->t()-Aufrufen im Code
# passen (keine fehlenden/toten Keys, .js == .json).

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'src/**'
      - 'lib/**'
      - 'templates/**'
      - 'appinfo/**'
      - 'l10n/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  l10n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Der Pruefer kommt aus nc-app-tooling und liegt erst nach dem Install vor.
      # Bewusst der normale Install statt eines direkten Griffs zum Tag: die
      # gepinnte Version steht in package.json, und die soll die einzige Stelle
      # bleiben. Ein Tag im Workflow waere eine zweite, die beim naechsten Bump
      # stillschweigend zurueckfaellt.
      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: l10n-Kataloge gegen Code pruefen
        run: npm run l10n:check
